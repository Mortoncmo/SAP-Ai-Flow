name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest
      # Chroma is embedded only; SECURITY.md records why its unpatched HTTP-server CVE is unreachable.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: python scripts/security_scan.py --include-build

  docx-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install LibreOffice, Poppler, and Chinese fonts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            libreoffice-writer poppler-utils fonts-noto-cjk
          fc-cache --force
      - name: Install DOCX renderer dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Render and verify representative SAP blueprint DOCX
        run: python scripts/verify_docx_render.py --output-dir output/docx-render-qa
      - name: Upload DOCX render QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docx-render-qa
          path: output/docx-render-qa
          if-no-files-found: warn
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: sap-ai-flow-ci
      SAP_FLOW_IMAGE_TAG: ci
      POSTGRES_DB: sap_blueprint
      POSTGRES_USER: sap_blueprint
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      OIDC_ISSUER: https://ci.invalid
      OIDC_AUDIENCE: sap-ai-flow-ci
      OIDC_JWKS_URL: https://ci.invalid/.well-known/jwks.json
      OIDC_ALLOWED_TENANT_IDS: ci-tenant
      EXPORT_STALE_MINUTES: 1
      EXPORT_LEASE_HEARTBEAT_SECONDS: 5
      VITE_OIDC_AUTHORITY: https://ci.invalid
      VITE_OIDC_CLIENT_ID: sap-ai-flow-ci-web
      VITE_OIDC_REDIRECT_URI: http://localhost:8080/auth/callback
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:8080/
      VITE_OIDC_AUDIENCE: sap-ai-flow-ci
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v5
      - name: Validate Prometheus and Alertmanager configuration
        run: |
          docker run --rm --entrypoint promtool \
            --volume "$PWD/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            --volume "$PWD/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint amtool \
            --volume "$PWD/deploy/monitoring:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Prepare acceptance output
        run: mkdir -p output
      - name: Build Compose images
        run: docker compose -f deploy/docker-compose.yml build
      - name: Generate API image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-api:${{ env.SAP_FLOW_IMAGE_TAG }}
          format: cyclonedx
          output: output/sap-ai-flow-api.cdx.json
      - name: Generate Web image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-web:${{ env.SAP_FLOW_IMAGE_TAG }}
          format: cyclonedx
          output: output/sap-ai-flow-web.cdx.json
      - name: Upload image SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: container-sboms
          path: output/*.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Scan API image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-api:${{ env.SAP_FLOW_IMAGE_TAG }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Web image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-web:${{ env.SAP_FLOW_IMAGE_TAG }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start clean Compose stack
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/health/ready > output/readiness.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --no-color
          exit 1
      - name: Verify readiness and migration head
        run: |
          python -c "import json; p=json.load(open('output/readiness.json')); assert p['status']=='ok' and p['tenant_isolation']=='oidc_claim_allowlist' and p['database']=='ready' and p['database_backend']=='postgresql' and p['export_execution']=='worker' and p['artifact_storage']=='filesystem' and p['artifact_storage_status']=='ready', p"
          test "$(docker compose -f deploy/docker-compose.yml ps --status running --services | grep -c '^worker$')" = "1"
          docker compose -f deploy/docker-compose.yml exec -T api alembic current \
            | tee output/alembic-current.txt
          grep -q '20260810_0009 (head)' output/alembic-current.txt
      - name: Exercise Alertmanager notification routing
        run: |
          docker compose -f deploy/docker-compose.yml --profile monitoring up -d \
            alert-drill-receiver alertmanager prometheus
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9093/-/ready > /dev/null && \
              curl --fail --silent http://127.0.0.1:9090/-/ready > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9093/-/ready > /dev/null
          curl --fail --silent http://127.0.0.1:9090/-/ready > /dev/null
          python - <<'PY'
          import json
          from datetime import UTC, datetime, timedelta

          now = datetime.now(UTC)
          payload = [{
              "labels": {
                  "alertname": "SapAiFlowAcceptanceDrill",
                  "severity": "critical",
              },
              "annotations": {"summary": "Synthetic CI notification route drill"},
              "startsAt": now.isoformat(),
              "endsAt": (now + timedelta(minutes=5)).isoformat(),
          }]
          with open("output/alertmanager-drill-request.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data-binary @output/alertmanager-drill-request.json \
            http://127.0.0.1:9093/api/v2/alerts
          for attempt in {1..30}; do
            if docker compose -f deploy/docker-compose.yml exec -T api \
              python -c "import urllib.request; print(urllib.request.urlopen('http://alert-drill-receiver:8080/events').read().decode())" \
              > output/alertmanager-drill.json && \
              python -c "import json; p=json.load(open('output/alertmanager-drill.json')); assert any(e['alertname']=='SapAiFlowAcceptanceDrill' and e['severity']=='critical' and e['status']=='firing' for e in p['events']), p"; then
              break
            fi
            sleep 1
          done
          python -c "import json; p=json.load(open('output/alertmanager-drill.json')); assert p['status']=='ok' and p['event_count']>=1 and all(set(e)=={'received_at','alertname','severity','status'} for e in p['events']), p"
      - name: Exercise PostgreSQL multi-worker fencing
        run: |
          docker compose -f deploy/docker-compose.yml up -d --scale worker=2 worker
          for attempt in {1..30}; do
            mapfile -t worker_ids < <(docker compose -f deploy/docker-compose.yml ps -q worker)
            if [ "${#worker_ids[@]}" = "2" ] && \
              [ "$(docker inspect --format '{{.State.Health.Status}}' "${worker_ids[@]}" | grep -c '^healthy$')" = "2" ]; then
              break
            fi
            sleep 1
          done
          mapfile -t worker_ids < <(docker compose -f deploy/docker-compose.yml ps -q worker)
          test "${#worker_ids[@]}" = "2"
          test "$(docker inspect --format '{{.State.Health.Status}}' "${worker_ids[@]}" | grep -c '^healthy$')" = "2"
          docker compose -f deploy/docker-compose.yml exec -T api \
            python -m app.workers.export_worker_acceptance \
            | tee output/export-worker-acceptance.json
          python -c "import json; p=json.load(open('output/export-worker-acceptance.json')); assert p['status']=='passed' and p['database_backend']=='postgresql' and p['export_execution']=='worker' and p['artifact_storage']=='filesystem' and p['database_content_empty'] is True and p['parallel_job_count']==12 and p['exactly_once_job_count']==12 and p['stale_attempt_count']==2 and p['stale_write_rejected'] is True and p['fresh_heartbeat_preserved'] is True, p"
      - name: Exercise rolling interruption recovery for a long DOCX task
        run: |
          docker compose -f deploy/docker-compose.yml stop worker
          docker compose -f deploy/docker-compose.yml exec -T api \
            python -m app.workers.export_worker_interruption_acceptance prepare \
            > output/export-worker-interruption-prepare.json
          export_id="$(python -c "import json; print(json.load(open('output/export-worker-interruption-prepare.json'))['export_id'])")"
          docker compose -f deploy/docker-compose.yml run -d --no-deps \
            --name sap-ai-flow-interrupted-worker \
            -e APP_ENV=acceptance \
            -e EXPORT_ACCEPTANCE_RENDER_DELAY_SECONDS=90 \
            worker
          docker compose -f deploy/docker-compose.yml exec -T api \
            python -m app.workers.export_worker_interruption_acceptance \
              wait-running --export-id "$export_id" \
            > output/export-worker-interruption-running.json
          docker kill sap-ai-flow-interrupted-worker
          docker rm sap-ai-flow-interrupted-worker
          sleep 65
          docker compose -f deploy/docker-compose.yml up -d --scale worker=1 worker
          for attempt in {1..30}; do
            worker_id="$(docker compose -f deploy/docker-compose.yml ps -q worker)"
            if [ -n "$worker_id" ] && \
              [ "$(docker inspect --format '{{.State.Health.Status}}' "$worker_id")" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          docker compose -f deploy/docker-compose.yml exec -T api \
            python -m app.workers.export_worker_interruption_acceptance \
              verify --export-id "$export_id" \
            | tee output/export-worker-interruption.json
          python -c "import json; p=json.load(open('output/export-worker-interruption.json')); assert p['status']=='passed' and p['database_backend']=='postgresql' and p['artifact_storage']=='filesystem' and p['long_document_node_count']==80 and p['interrupted_attempt_count']==2 and p['replacement_completed'] is True and p['database_content_empty'] is True and p['content_length']>10000, p"
      - name: Exercise PostgreSQL backup and restore
        run: |
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            pg_dump --clean --if-exists --no-owner \
              --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            > output/postgres.sql
          test -s output/postgres.sql
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            createdb --username "$POSTGRES_USER" sap_blueprint_restore
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql --username "$POSTGRES_USER" --dbname sap_blueprint_restore \
              --set ON_ERROR_STOP=on \
            < output/postgres.sql
          restored_head="$(docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql --username "$POSTGRES_USER" --dbname sap_blueprint_restore \
              --tuples-only --no-align --command 'SELECT version_num FROM alembic_version;')"
          test "$restored_head" = "20260810_0009"
      - name: Upload deployment acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-acceptance
          path: |
            output/readiness.json
            output/alembic-current.txt
            output/alertmanager-drill.json
            output/export-worker-acceptance.json
            output/export-worker-interruption.json
          if-no-files-found: warn
          retention-days: 14
      - name: Show Compose diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
