name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: pytest
      # Chroma is embedded only; SECURITY.md records why its unpatched HTTP-server CVE is unreachable.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-311

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: python scripts/security_scan.py --include-build

  deploy:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: sap-ai-flow-ci
      SAP_FLOW_IMAGE_TAG: ci
      POSTGRES_DB: sap_blueprint
      POSTGRES_USER: sap_blueprint
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
      OIDC_ISSUER: https://ci.invalid
      OIDC_AUDIENCE: sap-ai-flow-ci
      OIDC_JWKS_URL: https://ci.invalid/.well-known/jwks.json
      VITE_OIDC_AUTHORITY: https://ci.invalid
      VITE_OIDC_CLIENT_ID: sap-ai-flow-ci-web
      VITE_OIDC_REDIRECT_URI: http://localhost:8080/auth/callback
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:8080/
      VITE_OIDC_AUDIENCE: sap-ai-flow-ci
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Prepare acceptance output
        run: mkdir -p output
      - name: Build Compose images
        run: docker compose -f deploy/docker-compose.yml build
      - name: Generate API image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-api:${{ env.SAP_FLOW_IMAGE_TAG }}
          format: cyclonedx
          output: output/sap-ai-flow-api.cdx.json
      - name: Generate Web image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-web:${{ env.SAP_FLOW_IMAGE_TAG }}
          format: cyclonedx
          output: output/sap-ai-flow-web.cdx.json
      - name: Upload image SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: container-sboms
          path: output/*.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Scan API image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-api:${{ env.SAP_FLOW_IMAGE_TAG }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan Web image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sap-ai-flow-web:${{ env.SAP_FLOW_IMAGE_TAG }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start clean Compose stack
        run: |
          docker compose -f deploy/docker-compose.yml up -d
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/health/ready > output/readiness.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --no-color
          exit 1
      - name: Verify readiness and migration head
        run: |
          python -c "import json; p=json.load(open('output/readiness.json')); assert p['status']=='ok' and p['database']=='ready', p"
          docker compose -f deploy/docker-compose.yml exec -T api alembic current \
            | tee output/alembic-current.txt
          grep -q '20260809_0005 (head)' output/alembic-current.txt
      - name: Exercise PostgreSQL backup and restore
        run: |
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            pg_dump --clean --if-exists --no-owner \
              --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            > output/postgres.sql
          test -s output/postgres.sql
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            createdb --username "$POSTGRES_USER" sap_blueprint_restore
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql --username "$POSTGRES_USER" --dbname sap_blueprint_restore \
              --set ON_ERROR_STOP=on \
            < output/postgres.sql
          restored_head="$(docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql --username "$POSTGRES_USER" --dbname sap_blueprint_restore \
              --tuples-only --no-align --command 'SELECT version_num FROM alembic_version;')"
          test "$restored_head" = "20260809_0005"
      - name: Show Compose diagnostics on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps
          docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop Compose stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
