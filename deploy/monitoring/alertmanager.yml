global:
  resolve_timeout: 5m

route:
  receiver: local-drill-webhook
  group_by:
    - alertname
    - severity
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 4h

receivers:
  - name: local-drill-webhook
    webhook_configs:
      - url: http://alert-drill-receiver:8080/alerts
        send_resolved: true
